<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다다페스타 | 제3회 성북거리문화축제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#F7CE68;
    font-family:'Gowun Dodum', sans-serif;
    line-height:1.7;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:36px 16px 40px;
  }

  /* 포스터 영역 */
  .hero{
    text-align:center;
    padding:0 10px 20px;
  }
  .hero img{
    width:100%;
    max-width:420px;
    border-radius:18px;
    display:block;
    margin:0 auto;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
  }
  .hero .dday{
    display:inline-block;
    margin-top:20px;
    background:#1B1B18;
    color:#F7CE68;
    font-weight:700;
    font-size:15px;
    letter-spacing:1px;
    padding:8px 20px;
    border-radius:100px;
  }

  /* 어두운 카드 */
  .card{
    background:#171B2E;
    border-radius:28px;
    padding:38px 26px 30px;
    text-align:center;
    color:#fff;
    margin-top:22px;
  }
  .card .emoji{
    font-size:26px;
    margin-bottom:18px;
  }
  .card h2{
    color:#F5C242;
    font-weight:700;
    font-size:20px;
    line-height:1.6;
    margin-bottom:12px;
  }
  .card p.info{
    color:#fff;
    font-size:14.5px;
    line-height:1.8;
    opacity:0.92;
    margin-bottom:18px;
  }
  .card p.closing{
    color:#F5C242;
    font-weight:700;
    font-size:16px;
    margin-bottom:26px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .links a{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:#FBF3DD;
    color:#1B1B18;
    border:2px solid #1B1B18;
    border-radius:100px;
    padding:13px 18px;
    text-decoration:none;
    font-weight:700;
    font-size:14.5px;
  }

  footer{
    margin-top:26px;
    text-align:center;
    font-size:12.5px;
    color:#6b5416;
    line-height:1.7;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <img src="poster.png" alt="제3회 성북거리문화축제 다다페스타 포스터">
    <div class="dday" id="ddayBadge">D-day 계산 중...</div>
  </div>

  <div class="card">
    <div class="emoji">🎪✨</div>
    <h2>다다페스타가<br>여러분을 찾아갑니다</h2>
    <p class="info">
      2026. 10. 31.(토) 11:00 ~ 17:00<br>
      장월로37길(꿈의숲아이파크~래미안장위퍼스트하이 사이길)에서 열립니다
    </p>
    <p class="closing">다 함께 만나요! 🙌</p>

    <div class="links">
      <a href="https://map.naver.com/p/search/%EC%8A%A4%ED%83%80%EB%B2%85%EC%8A%A4%20%EC%9E%A5%EC%9C%84%EB%89%B4%ED%83%80%EC%9A%B4%EC%A0%90" target="_blank" rel="noopener">📍 오시는 길</a>
      <a href="https://www.instagram.com/dada_festa/" target="_blank" rel="noopener">📷 인스타그램</a>
      <a href="https://cotton-waterlily-c0d.notion.site/3-3bbca66a69a98056affee4c25dc71462?source=copy_link" target="_blank" rel="noopener">📋 상세내용 보기</a>
      <a href="https://youtu.be/GF7mOONCoQI?si=T0y0e6e4wVHSh_wl" target="_blank" rel="noopener">🎬 2회 축제 기록 보기</a>
      <a href="mailto:doldol.art2024@gmail.com">✉ 문의하기</a>
    </div>
  </div>

  <footer>
    제3회 성북거리문화축제 다다페스타<br>
    2026. 10. 31.(토) 장월로37길 일대<br>
    주최/주관 성북구·성북문화재단
  </footer>

</div>

<script>
  const target = new Date('2026-10-31T00:00:00+09:00');
  const today = new Date();
  const t0 = new Date(target.getFullYear(), target.getMonth(), target.getDate());
  const d0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const diff = Math.round((t0 - d0) / 86400000);
  const badge = document.getElementById('ddayBadge');
  if(diff > 0){ badge.textContent = 'D-' + diff; }
  else if(diff === 0){ badge.textContent = 'D-DAY'; }
  else { badge.textContent = '축제가 마무리되었습니다'; }
</script>

</body>
</html>
